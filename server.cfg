// server.cfg for Team Fortress 2 on Flux. Run on every map load. Edit it in your panel's file
// manager: custom/flux/cfg/server.cfg. Settings the panel owns (name, passwords, players, map)
// are on the command line and win over this file.
sv_allowupload 1
sv_allowdownload 1
mp_timelimit 30
mp_maxrounds 0
mp_winlimit 0
tf_allow_player_use 0
sv_alltalk 0
mp_autoteambalance 1
mp_teams_unbalance_limit 1
tf_weapon_criticals 1
tv_enable 0
// Maps up to 64 MB download from the server itself; bigger ones need FastDL (sv_downloadurl).
net_maxfilesize 64
